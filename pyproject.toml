[project]
name = "apis-server"
version = "1.0.0"
description = "API de solo lectura sobre vistas Oracle"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# En tests se permiten assert y claves ficticias.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# no:faulthandler: la JVM (JPype) usa "access violations" internas en Windows que el
# faulthandler de pytest imprime como si fueran errores, aunque los tests pasen.
addopts = "-q -p no:faulthandler"
